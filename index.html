<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>数学启蒙小游戏</title>
    <link rel="stylesheet" href="common.css" />
    <style>
      .cards {
        display: flex;
        flex-direction: column;
        gap: 16px;
        width: 100%;
        max-width: 480px;
        padding: 0 16px;
        box-sizing: border-box;
      }

      .card {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 18px 20px;
        border-radius: 16px;
        background-color: white;
        color: inherit;
        text-decoration: none;
        box-shadow: 0 3px 8px rgba(0, 0, 0, 0.08);
        transition: transform 0.2s, box-shadow 0.2s;
      }

      .card:active {
        transform: scale(0.98);
      }

      @media (hover: hover) {
        .card:hover {
          transform: translateY(-2px);
          box-shadow: 0 6px 14px rgba(0, 0, 0, 0.12);
        }
      }

      .card-emoji {
        font-size: 3rem;
      }

      .card-body {
        flex: 1;
        min-width: 0;
      }

      .card-title {
        font-size: 1.4rem;
        font-weight: bold;
        color: var(--main-color);
      }

      .card-desc {
        margin-top: 4px;
        font-size: 0.95rem;
        color: #64748b;
      }

      .card-progress {
        font-size: 0.9rem;
        color: #b45309;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <h1 class="title">数学启蒙小游戏</h1>
    <div class="cards">
      <!-- data-key：该游戏在 localStorage 里保存闯关进度的键 -->
      <a class="card" href="number.html" data-key="learningNumber.progress">
        <div class="card-emoji">🔢</div>
        <div class="card-body">
          <div class="card-title">认识数位</div>
          <div class="card-desc">个十百千万 · 满十进一</div>
        </div>
        <div class="card-progress"></div>
      </a>
      <a class="card" href="make-ten.html" data-key="learningNumber.makeTen">
        <div class="card-emoji">🔟</div>
        <div class="card-body">
          <div class="card-title">凑十法</div>
          <div class="card-desc">20 以内进位加法 · 退位减法</div>
        </div>
        <div class="card-progress"></div>
      </a>
      <a class="card" href="clock.html" data-key="learningNumber.clock">
        <div class="card-emoji">🕗</div>
        <div class="card-body">
          <div class="card-title">认识钟表</div>
          <div class="card-desc">整时 · 半时 · 几时几分</div>
        </div>
        <div class="card-progress"></div>
      </a>
    </div>
    <script>
      // 在卡片上显示闯到第几关、一共得了几颗星
      document.querySelectorAll(".card").forEach((card) => {
        let text = "还没开始";
        try {
          const saved = JSON.parse(localStorage.getItem(card.dataset.key));
          if (saved) {
            const stars = (saved.progress || []).reduce((sum, n) => sum + (Number(n) || 0), 0);
            text = `第${(Number(saved.currentLevel) || 0) + 1}关 · ⭐${stars}`;
          }
        } catch (e) {
          // 读不到进度时显示"还没开始"
        }
        card.querySelector(".card-progress").textContent = text;
      });
    </script>
  </body>
</html>
